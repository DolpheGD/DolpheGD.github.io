<!--
  Giscus reactions/comments -- backed by GitHub Discussions on this repo,
  no server or third-party database of our own involved. Live as of the
  giscus app install + Discussions setup + repo/category IDs in
  _config.yml. Every entry page gets its own discussion thread (matched by
  URL path), and visitors can leave 👍 / 👎 / ❤️ / 🚀 / 👀 reactions and
  comments, signed in with their own GitHub account. Reactions and threads
  are also visible in the repo's Discussions tab.
-->
<h2 class="child-entries-title giscus-title">Reactions &amp; Comments</h2>
<script src="https://giscus.app/client.js"
        data-repo="{{ site.giscus.repo }}"
        data-repo-id="{{ site.giscus.repo_id }}"
        data-category="{{ site.giscus.category }}"
        data-category-id="{{ site.giscus.category_id }}"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="en"
        crossorigin="anonymous"
        async>
</script>
